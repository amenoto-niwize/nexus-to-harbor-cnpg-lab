# Harbor chart 1.11.0 (Harbor 2.7.0, ChartMuseum 포함) + 외부 DB = CloudNativePG(harbor-pg)
# 랩(cp1 arm64): 이미지는 ghcr.io/octohelm/harbor/*:v2.7.0, containerd 가 ghcr.io → 172.16.141.10:5000 미러
# 운영(amd64)이면 이미지 블록을 지우고 차트 기본값(goharbor/*:v2.7.0)을 쓴다.
# admin 비밀번호는 여기 두지 않는다: 설치 시 --set harborAdminPassword=...
expose:
  type: nodePort
  tls:
    enabled: false
  nodePort:
    name: harbor
    ports:
      http:
        port: 80
        nodePort: 30004
externalURL: http://172.16.141.11:30004

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:      {storageClass: local-path, size: 5Gi}
    chartmuseum:   {storageClass: local-path, size: 2Gi}
    jobservice:
      jobLog:          {storageClass: local-path, size: 1Gi}
      scanDataExports: {storageClass: local-path, size: 1Gi}
    redis:         {storageClass: local-path, size: 1Gi}

# ---- DB: CNPG ----
database:
  type: external
  external:
    host: harbor-pg-rw.harbor-cnpg.svc     # CNPG 가 만든 '쓰기(primary)' 서비스
    port: "5432"
    username: harbor                        # bootstrap.initdb.owner
    coreDatabase: registry                  # bootstrap.initdb.database
    existingSecret: harbor-pg-app           # CNPG 가 생성한 Secret, 키 'password' 를 그대로 읽음
    sslmode: require                        # CNPG 는 기본으로 TLS 를 켠다
  # 차트 기본 maxOpenConns 900 은 PG max_connections(200)를 넘는다 → 반드시 낮춘다
  maxIdleConns: 10
  maxOpenConns: 50

trivy:      {enabled: false}
notary:     {enabled: false}
metrics:    {enabled: false}
chartmuseum:
  enabled: true
  absoluteUrl: false
  image: {repository: ghcr.io/octohelm/harbor/chartmuseum-photon, tag: v2.7.0}
nginx:
  image: {repository: ghcr.io/octohelm/harbor/nginx-photon, tag: v2.7.0}
portal:
  image: {repository: ghcr.io/octohelm/harbor/harbor-portal, tag: v2.7.0}
core:
  image: {repository: ghcr.io/octohelm/harbor/harbor-core, tag: v2.7.0}
jobservice:
  image: {repository: ghcr.io/octohelm/harbor/harbor-jobservice, tag: v2.7.0}
registry:
  registry:
    image: {repository: ghcr.io/octohelm/harbor/registry-photon, tag: v2.7.0}
  controller:
    image: {repository: ghcr.io/octohelm/harbor/harbor-registryctl, tag: v2.7.0}
redis:
  type: internal
  internal:
    image: {repository: ghcr.io/octohelm/harbor/redis-photon, tag: v2.7.0}
exporter:
  image: {repository: ghcr.io/octohelm/harbor/harbor-exporter, tag: v2.7.0}
